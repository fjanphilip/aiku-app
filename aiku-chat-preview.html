<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Aiku — Chat UI Preview</title>
<style>
  :root{
    /* ── aiku tokens (types/design.ts) ───────────────────────── */
    --bg:#121214;
    --surface:#201f21;
    --surface-high:#2a2a2c;
    --surface-highest:#353437;
    --elevated:#242429;

    --primary:#FFC72C;
    --primary-soft:#f6bf22;
    --primary-dim:rgba(255,199,44,.15);
    --accent-container:#2A2412;
    --on-primary:#1A1400;

    --text:#F4F4F6;
    --text-2:#9E9EA7;
    --text-muted:#71717A;

    --hairline:#2E2E36;
    --hairline-weak:rgba(255,255,255,.05);
    --hairline-strong:#3F3F4A;
    --success:#10B981;

    --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px; --r-pill:999px;
    --ease:cubic-bezier(.32,.72,0,1);

    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,"Helvetica Neue",Arial,sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  ::selection{background:var(--primary-dim)}
  .micro{
    font-size:10px;font-weight:600;letter-spacing:1.6px;
    text-transform:uppercase;color:var(--text-muted);
  }
  .icon{width:18px;height:18px;flex-shrink:0;display:block}
  .scroll{scrollbar-width:thin;scrollbar-color:var(--hairline-strong) transparent}
  .scroll::-webkit-scrollbar{width:6px}
  .scroll::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:20px}
  .scroll::-webkit-scrollbar-track{background:transparent}

  /* ── shell ────────────────────────────────────────────────── */
  .app{display:flex;height:100dvh;overflow:hidden}

  /* ── sidebar ──────────────────────────────────────────────── */
  .sidebar{
    width:288px;flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--hairline);
    display:flex;flex-direction:column;
    position:relative;z-index:50;
  }
  .brand{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 14px 14px;
  }
  .brand-left{display:flex;align-items:center;gap:10px}
  .logo{
    width:30px;height:30px;border-radius:10px;
    background:linear-gradient(150deg,var(--primary) 0%,var(--primary-soft) 100%);
    color:var(--on-primary);
    display:grid;place-items:center;
    font-weight:800;font-size:15px;letter-spacing:-.5px;
    box-shadow:0 4px 18px rgba(255,199,44,.28);
  }
  .brand-name{font-size:17px;font-weight:700;letter-spacing:-.5px}
  .icon-btn{
    width:34px;height:34px;border-radius:var(--r-md);
    display:grid;place-items:center;color:var(--text-2);
    border:1px solid transparent;
    transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease);
  }
  .icon-btn:hover{background:var(--surface-high);color:var(--text);border-color:var(--hairline)}

  .side-actions{display:flex;flex-direction:column;gap:2px;padding:0 10px 12px}
  .side-row{
    display:flex;align-items:center;gap:11px;
    padding:9px 11px;border-radius:var(--r-md);
    font-size:14px;font-weight:500;color:var(--text-2);
    transition:background .2s var(--ease),color .2s var(--ease);
  }
  .side-row:hover{background:var(--surface-high);color:var(--text)}
  .side-row.primary{color:var(--text)}
  .side-row .icon{color:var(--primary)}
  .side-row .kbd{
    margin-left:auto;font-size:10px;font-weight:600;letter-spacing:.4px;
    color:var(--text-muted);border:1px solid var(--hairline);
    border-radius:var(--r-sm);padding:2px 5px;
  }

  .side-scroll{flex:1;overflow-y:auto;padding:0 10px 14px}
  .side-section{margin-top:14px}
  .side-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 11px 8px;
  }
  .side-head button{color:var(--text-muted);padding:2px;border-radius:6px}
  .side-head button:hover{color:var(--text);background:var(--surface-high)}

  .folder{
    display:flex;align-items:center;gap:11px;
    padding:8px 11px;border-radius:var(--r-md);
    font-size:13.5px;color:var(--text-2);
    transition:background .2s var(--ease),color .2s var(--ease);
  }
  .folder:hover{background:var(--surface-high);color:var(--text)}
  .count{
    margin-left:auto;font-size:11px;font-weight:600;
    color:var(--text-muted);background:var(--surface-high);
    border-radius:var(--r-pill);padding:2px 8px;
  }
  .folder:hover .count{background:var(--surface-highest);color:var(--text-2)}

  .thread{
    display:flex;align-items:center;gap:11px;
    padding:8px 11px;border-radius:var(--r-md);
    font-size:13.5px;color:var(--text-2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    transition:background .2s var(--ease),color .2s var(--ease);
    width:100%;text-align:left;
  }
  .thread span{overflow:hidden;text-overflow:ellipsis}
  .thread:hover{background:var(--surface-high);color:var(--text)}
  .thread.active{background:var(--primary-dim);color:var(--primary);font-weight:600}
  .thread.active .dot{background:var(--primary)}

  .user-card{
    margin:10px;padding:10px;
    background:var(--surface-high);
    border:1px solid var(--hairline);
    border-radius:var(--r-lg);
    display:flex;align-items:center;gap:10px;
  }
  .user-avatar{
    width:36px;height:36px;border-radius:50%;
    background:var(--accent-container);color:var(--primary);
    display:grid;place-items:center;font-weight:700;font-size:14px;
    border:1px solid rgba(255,199,44,.28);
  }
  .user-meta{min-width:0;flex:1}
  .user-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-plan{font-size:11.5px;color:var(--text-muted)}
  .upgrade{
    background:var(--primary);color:var(--on-primary);
    font-size:12px;font-weight:700;letter-spacing:.1px;
    padding:7px 12px;border-radius:var(--r-pill);
    transition:transform .2s var(--ease),filter .2s var(--ease);
  }
  .upgrade:hover{filter:brightness(1.06)}
  .upgrade:active{transform:scale(.96)}

  /* ── main ─────────────────────────────────────────────────── */
  .main{
    flex:1;min-width:0;position:relative;
    display:flex;flex-direction:column;
  }
  .ambient{
    position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;
  }
  .halo{
    position:absolute;top:-60px;left:50%;translate:-50% 0;
    width:460px;height:460px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(255,199,44,.14),rgba(255,199,44,.03) 60%,transparent 100%);
    animation:breathe 10s ease-in-out infinite;
  }
  .vignette{
    position:absolute;top:0;left:0;right:0;height:320px;
    background:linear-gradient(180deg,rgba(42,36,18,.25),transparent 70%);
  }
  @keyframes breathe{
    0%,100%{transform:scale(1);opacity:.75}
    50%{transform:scale(1.08);opacity:1}
  }

  .topbar{
    position:relative;z-index:10;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 16px 12px;
    border-bottom:1px solid var(--hairline-weak);
  }
  .topbar-center{display:flex;align-items:center;gap:8px;min-width:0}
  .topbar-title{font-size:20px;font-weight:700;letter-spacing:-.5px}
  .model-badge{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--hairline);
    padding:5px 10px;border-radius:var(--r-pill);
    font-size:11px;font-weight:500;color:var(--text-2);
    max-width:190px;
    transition:border-color .2s var(--ease),background .2s var(--ease);
  }
  .model-badge:hover{border-color:var(--hairline-strong);background:var(--surface-high)}
  .model-badge span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status-dot{width:6px;height:6px;border-radius:50%;background:var(--success);flex-shrink:0}
  .status-dot::after{content:""}

  .stage-wrap{
    position:relative;z-index:1;flex:1;min-height:0;
    overflow-y:auto;overflow-x:hidden;
    display:flex;flex-direction:column;
  }
  .stage-wrap>*{flex-shrink:0}
  .stage{
    margin:auto;width:100%;max-width:440px;
    padding:28px 20px 16px;
    display:flex;flex-direction:column;align-items:center;
    animation:rise .5s var(--ease) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .orb-wrap{position:relative;display:grid;place-items:center;margin-bottom:16px}
  .orb-glow{
    position:absolute;width:140px;height:140px;border-radius:50%;
    background:rgba(255,199,44,.12);filter:blur(2px);
  }
  .orb{
    position:relative;width:92px;height:92px;border-radius:50%;
    background:var(--surface);border:1px solid rgba(255,199,44,.28);
    display:grid;place-items:center;overflow:visible;
    box-shadow:0 4px 18px rgba(255,199,44,.25);
  }
  .orb img{width:84px;height:84px;border-radius:50%;object-fit:cover;display:block}
  .orb .initial{font-size:32px;font-weight:700;color:var(--primary);letter-spacing:-1px}
  .presence{
    position:absolute;bottom:0;right:0;
    width:20px;height:20px;border-radius:50%;
    background:var(--primary);border:3px solid var(--bg);
    display:grid;place-items:center;
  }
  .presence i{width:6px;height:6px;border-radius:50%;background:var(--on-primary);display:block}

  .title{font-size:24px;font-weight:700;letter-spacing:-.4px;text-align:center}
  .subtitle{
    font-size:15px;color:var(--text-2);text-align:center;
    margin:6px 0 26px;line-height:22px;max-width:330px;
  }

  .suggestions{width:100%;display:flex;flex-direction:column;gap:10px}
  .sugg{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    width:100%;text-align:left;
    background:var(--surface-high);
    border:1px solid var(--hairline);
    border-radius:var(--r-pill);
    padding:12px 16px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
    transition:transform .2s var(--ease),border-color .2s var(--ease),background .2s var(--ease);
  }
  .sugg:hover{transform:translateY(-1px);border-color:var(--hairline-strong);background:var(--surface-highest)}
  .sugg:active{transform:scale(.985)}
  .sugg-left{display:flex;align-items:center;gap:12px;min-width:0}
  .sugg-badge{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    display:grid;place-items:center;
    background:var(--surface);color:var(--primary);
  }
  .sugg.hl .sugg-badge{background:var(--accent-container)}
  .sugg-text{font-size:14px;font-weight:500;letter-spacing:-.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sugg .chev{color:var(--text-2);flex-shrink:0}

  /* ── conversation state ───────────────────────────────────── */
  .chat{
    width:100%;max-width:760px;
    margin:0 auto;                 /* horizontal centre, top-aligned */
    padding:22px 16px 28px;
    display:flex;flex-direction:column;gap:18px;
  }
  .msg{display:flex;gap:10px;animation:rise .35s var(--ease) both}
  .msg.user{justify-content:flex-end}
  .bubble{
    max-width:78%;padding:11px 15px;border-radius:var(--r-lg);
    font-size:14.5px;line-height:21px;white-space:pre-wrap;word-break:break-word;
  }
  .msg.user .bubble{
    background:var(--primary);color:var(--on-primary);
    border-bottom-right-radius:var(--r-sm);font-weight:500;
  }
  .msg.ai .bubble{
    background:var(--surface);border:1px solid var(--hairline);
    color:var(--text);border-bottom-left-radius:var(--r-sm);
  }
  .msg-avatar{
    width:28px;height:28px;border-radius:50%;flex-shrink:0;margin-top:2px;
    background:var(--accent-container);color:var(--primary);
    display:grid;place-items:center;font-size:12px;font-weight:800;
    border:1px solid rgba(255,199,44,.28);
  }
  .typing{display:flex;gap:4px;align-items:center;padding:2px 0}
  .typing i{
    width:6px;height:6px;border-radius:50%;background:var(--text-muted);
    animation:blink 1.2s infinite;
  }
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* ── composer ─────────────────────────────────────────────── */
  .composer-area{
    position:relative;z-index:10;
    padding:10px 16px 18px;
    display:flex;flex-direction:column;align-items:center;
    background:linear-gradient(180deg,transparent,var(--bg) 40%);
  }
  .composer{
    width:100%;max-width:760px;
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:var(--r-xl);
    padding:10px 12px 8px;
    transition:border-color .2s var(--ease),box-shadow .2s var(--ease);
  }
  .composer:focus-within{
    border-color:rgba(255,199,44,.55);
    box-shadow:0 0 0 3px rgba(255,199,44,.10);
  }
  .composer textarea{
    width:100%;background:none;border:0;outline:none;resize:none;
    color:var(--text);font-family:var(--font);font-size:15px;line-height:21px;
    max-height:150px;padding:4px 4px 8px;
  }
  .composer textarea::placeholder{color:var(--text-muted)}
  .composer-toolbar{display:flex;align-items:center;gap:8px}
  .tool{
    display:flex;align-items:center;gap:7px;
    padding:7px 11px;border-radius:var(--r-pill);
    font-size:12.5px;font-weight:500;color:var(--text-2);
    border:1px solid transparent;
    transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease);
  }
  .tool:hover{background:var(--surface-high);color:var(--text);border-color:var(--hairline)}
  .tool.square{padding:7px;border-radius:var(--r-md)}
  .spacer{flex:1}

  .model-picker{position:relative}
  .model-btn{
    display:flex;align-items:center;gap:7px;
    padding:6px 10px;border-radius:var(--r-pill);
    border:1px solid var(--hairline);background:var(--surface-high);
    font-size:12px;font-weight:500;color:var(--text-2);
    transition:border-color .2s var(--ease),color .2s var(--ease);
  }
  .model-btn:hover{border-color:var(--hairline-strong);color:var(--text)}
  .model-btn .chev{width:14px;height:14px;transition:transform .2s var(--ease)}
  .model-picker.open .model-btn .chev{transform:rotate(180deg)}
  .model-menu{
    position:absolute;bottom:calc(100% + 8px);right:0;width:230px;
    background:var(--elevated);border:1px solid var(--hairline-strong);
    border-radius:var(--r-lg);padding:6px;
    box-shadow:0 16px 40px rgba(0,0,0,.5);
    display:none;
  }
  .model-picker.open .model-menu{display:block;animation:rise .16s var(--ease) both}
  .model-item{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    padding:9px 10px;border-radius:var(--r-md);
    font-size:13px;color:var(--text-2);
  }
  .model-item:hover{background:var(--surface-high);color:var(--text)}
  .model-item.sel{color:var(--primary);background:var(--primary-dim);font-weight:600}
  .model-item small{margin-left:auto;font-size:10.5px;color:var(--text-muted);font-weight:500}

  .send{
    width:36px;height:36px;border-radius:50%;
    background:var(--primary);color:var(--on-primary);
    display:grid;place-items:center;
    transition:transform .2s var(--ease),opacity .2s var(--ease),filter .2s var(--ease);
  }
  .send:hover{filter:brightness(1.06)}
  .send:active{transform:scale(.92)}
  .send:disabled{opacity:.35;cursor:not-allowed;filter:none}

  .footnote{
    display:flex;align-items:center;gap:6px;
    margin-top:8px;font-size:11px;letter-spacing:.2px;color:var(--text-2);
  }
  .footnote .icon{width:12px;height:12px}

  .scrim{
    position:fixed;inset:0;background:rgba(0,0,0,.55);
    backdrop-filter:blur(2px);z-index:40;opacity:0;pointer-events:none;
    transition:opacity .3s var(--ease);
  }

  /* ── responsive: sidebar = drawer < 1024px ────────────────── */
  @media (max-width:1023px){
    .sidebar{
      position:fixed;top:0;bottom:0;left:0;
      transform:translateX(-100%);
      transition:transform .3s var(--ease);
      box-shadow:24px 0 60px rgba(0,0,0,.5);
    }
    .sidebar.open{transform:none}
    .scrim.show{opacity:1;pointer-events:auto}
    .desktop-only{display:none}
  }
  @media (min-width:1024px){
    .mobile-only{display:none}
    .composer-area{padding-bottom:22px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s!important;transition-duration:.001s!important}
  }
</style>
</head>
<body>
<div class="app">

  <!-- ══ Sidebar ══════════════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-left">
        <div class="logo">A</div>
        <div class="brand-name">Aiku</div>
      </div>
      <button class="icon-btn desktop-only" title="Collapse sidebar" aria-label="Collapse sidebar">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/><path d="M15 9.5 12.5 12 15 14.5"/>
        </svg>
      </button>
      <button class="icon-btn mobile-only" id="sidebarClose" aria-label="Close sidebar">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <div class="side-actions">
      <button class="side-row primary" id="newChat">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
        <span>New chat</span>
        <span class="kbd">⌘K</span>
      </button>
      <button class="side-row">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <span>Search</span>
      </button>
    </div>

    <div class="side-scroll scroll">
      <div class="side-section">
        <div class="side-head">
          <span class="micro">Projects</span>
          <button aria-label="New project">
            <svg class="icon" style="width:15px;height:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <button class="folder">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
          <span>Aiku App</span><span class="count">12</span>
        </button>
        <button class="folder">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
          <span>Design System</span><span class="count">8</span>
        </button>
        <button class="folder">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
          <span>9Router Notes</span><span class="count">5</span>
        </button>
      </div>

      <div class="side-section">
        <div class="side-head"><span class="micro">Today</span></div>
        <button class="thread active"><span>Streaming SSE di 9Router</span></button>
        <button class="thread"><span>Prompt untuk onboarding screen</span></button>
      </div>

      <div class="side-section">
        <div class="side-head"><span class="micro">Yesterday</span></div>
        <button class="thread"><span>Refactor hook useChat</span></button>
        <button class="thread"><span>Kenapa response-nya kosong?</span></button>
      </div>

      <div class="side-section">
        <div class="side-head"><span class="micro">Earlier</span></div>
        <button class="thread"><span>Setup expo-secure-store</span></button>
        <button class="thread"><span>Model mana yang paling cepat?</span></button>
      </div>
    </div>

    <div class="user-card">
      <div class="user-avatar">P</div>
      <div class="user-meta">
        <div class="user-name">Praze</div>
        <div class="user-plan">Free plan</div>
      </div>
      <button class="upgrade">Upgrade</button>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <!-- ══ Main ═════════════════════════════════════════════════ -->
  <main class="main">
    <div class="ambient"><div class="halo"></div><div class="vignette"></div></div>

    <header class="topbar">
      <button class="icon-btn mobile-only" id="sidebarOpen" aria-label="Open menu">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3.5 7h17M3.5 12h17M3.5 17h17"/></svg>
      </button>

      <div class="topbar-center">
        <span class="topbar-title">Aiku</span>
        <button class="model-badge" title="Active model">
          <span class="status-dot"></span>
          <span id="activeModelLabel">gpt-4o-mini</span>
        </button>
      </div>

      <button class="icon-btn" id="headerNewChat" aria-label="New chat">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <div class="stage-wrap scroll" id="stageWrap">
      <!-- Welcome state -->
      <section class="stage" id="stage">
        <div class="orb-wrap">
          <div class="orb-glow"></div>
          <div class="orb">
            <img src="assets/aiku-avatar.jpg" alt=""
                 onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'initial',textContent:'A'}))" />
            <div class="presence"><i></i></div>
          </div>
        </div>

        <h1 class="title">Aiku</h1>
        <p class="subtitle">Hello! How can I help you today?</p>

        <div class="suggestions" id="suggestions">
          <button class="sugg hl" data-prompt="What can you do?">
            <span class="sugg-left">
              <span class="sugg-badge">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>
              </span>
              <span class="sugg-text">What can you do?</span>
            </span>
            <svg class="icon chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
          </button>

          <button class="sugg" data-prompt="Help me write something">
            <span class="sugg-left">
              <span class="sugg-badge">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              </span>
              <span class="sugg-text">Help me write something</span>
            </span>
            <svg class="icon chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
          </button>

          <button class="sugg" data-prompt="Explain a topic">
            <span class="sugg-left">
              <span class="sugg-badge">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.5.4.8 1 .8 1.6v.5h5.4v-.5c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3Z"/></svg>
              </span>
              <span class="sugg-text">Explain a topic</span>
            </span>
            <svg class="icon chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
          </button>

          <button class="sugg" data-prompt="Summarize this text">
            <span class="sugg-left">
              <span class="sugg-badge">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 11h16M4 16h9"/></svg>
              </span>
              <span class="sugg-text">Summarize this text</span>
            </span>
            <svg class="icon chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
          </button>
        </div>
      </section>

      <!-- Conversation state -->
      <section class="chat" id="chat" hidden></section>
    </div>

    <footer class="composer-area">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Ask me anything..."></textarea>
        <div class="composer-toolbar">
          <button class="tool square" title="Attach file" aria-label="Attach file">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7l8.5-8.5a3.4 3.4 0 0 1 4.8 4.8L10.3 17.8a1.8 1.8 0 0 1-2.5-2.5l7.8-7.8"/></svg>
          </button>
          <button class="tool">
            <svg class="icon" style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4V2M15 10V8M11.5 6H9.5M20.5 6h-2M17.7 8.2l1.4 1.4M17.7 3.8l1.4-1.4M4 20l6-6"/><path d="M12 10h.01"/></svg>
            <span>Tools</span>
          </button>

          <span class="spacer"></span>

          <div class="model-picker" id="modelPicker">
            <button class="model-btn" id="modelBtn">
              <span class="status-dot"></span>
              <span id="modelBtnLabel">gpt-4o-mini</span>
              <svg class="icon chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="model-menu" id="modelMenu"></div>
          </div>

          <button class="send" id="send" disabled aria-label="Send">
            <svg class="icon" style="width:17px;height:17px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>

      <div class="footnote">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/></svg>
        <span>Free preview &bull; End-to-end encrypted session</span>
      </div>
    </footer>
  </main>
</div>

<script>
(function () {
  var MODELS = [
    { id: 'gpt-4o-mini',  note: 'fast' },
    { id: 'deepseek-v3',  note: 'balanced' },
    { id: 'llama-3.3-70b', note: 'smart' }
  ];
  var current = MODELS[0].id;

  var sidebar  = document.getElementById('sidebar');
  var scrim    = document.getElementById('scrim');
  var input    = document.getElementById('input');
  var send     = document.getElementById('send');
  var stage    = document.getElementById('stage');
  var chat     = document.getElementById('chat');
  var wrap     = document.getElementById('stageWrap');
  var picker   = document.getElementById('modelPicker');
  var menu     = document.getElementById('modelMenu');
  var modelBtnLabel = document.getElementById('modelBtnLabel');
  var activeModelLabel = document.getElementById('activeModelLabel');

  /* drawer (mobile) */
  function openDrawer()  { sidebar.classList.add('open');  scrim.classList.add('show'); }
  function closeDrawer() { sidebar.classList.remove('open'); scrim.classList.remove('show'); }
  document.getElementById('sidebarOpen').addEventListener('click', openDrawer);
  document.getElementById('sidebarClose').addEventListener('click', closeDrawer);
  scrim.addEventListener('click', closeDrawer);

  /* composer: autogrow + enable send */
  function syncInput() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 150) + 'px';
    send.disabled = !input.value.trim();
  }
  input.addEventListener('input', syncInput);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  send.addEventListener('click', submit);

  /* suggestions fill the composer */
  document.querySelectorAll('.sugg').forEach(function (btn) {
    btn.addEventListener('click', function () {
      input.value = btn.dataset.prompt;
      syncInput();
      input.focus();
    });
  });

  /* model picker */
  MODELS.forEach(function (m) {
    var b = document.createElement('button');
    b.className = 'model-item' + (m.id === current ? ' sel' : '');
    b.innerHTML = '<span>' + m.id + '</span><small>' + m.note + '</small>';
    b.addEventListener('click', function () {
      current = m.id;
      modelBtnLabel.textContent = m.id;
      activeModelLabel.textContent = m.id;
      menu.querySelectorAll('.model-item').forEach(function (x) { x.classList.remove('sel'); });
      b.classList.add('sel');
      picker.classList.remove('open');
    });
    menu.appendChild(b);
  });
  document.getElementById('modelBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    picker.classList.toggle('open');
  });
  document.addEventListener('click', function () { picker.classList.remove('open'); });

  /* new chat resets to the welcome state */
  function reset() {
    chat.hidden = true; chat.innerHTML = '';
    stage.hidden = false;
    input.value = ''; syncInput();
    closeDrawer();
  }
  document.getElementById('newChat').addEventListener('click', reset);
  document.getElementById('headerNewChat').addEventListener('click', reset);

  /* send → render a message + a mock streamed reply */
  function bubble(role, text) {
    var row = document.createElement('div');
    row.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
    if (role === 'ai') {
      var a = document.createElement('div');
      a.className = 'msg-avatar';
      a.textContent = 'A';
      row.appendChild(a);
    }
    var b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    row.appendChild(b);
    chat.appendChild(row);
    wrap.scrollTop = wrap.scrollHeight;
    return b;
  }

  function reply(text) {
    var row = document.createElement('div');
    row.className = 'msg ai';
    row.innerHTML =
      '<div class="msg-avatar">A</div>' +
      '<div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';
    chat.appendChild(row);
    wrap.scrollTop = wrap.scrollHeight;

    setTimeout(function () {
      var b = row.querySelector('.bubble');
      b.textContent = '';
      var i = 0;
      var t = setInterval(function () {
        b.textContent = text.slice(0, ++i);
        wrap.scrollTop = wrap.scrollHeight;
        if (i >= text.length) clearInterval(t);
      }, 12);
    }, 650);
  }

  var MOCK =
    'I\u2019m Aiku \u2014 an AI chat client connected to your self-hosted 9Router.\n\n' +
    'Ask anything and I\u2019ll stream the answer back, or open Settings to pick a different model.';

  function submit() {
    var text = input.value.trim();
    if (!text) return;

    if (stage.hidden === false) { stage.hidden = true; chat.hidden = false; }
    bubble('user', text);
    input.value = ''; syncInput();
    closeDrawer();
    reply(MOCK);
  }

  syncInput();
})();
</script>
</body>
</html>
